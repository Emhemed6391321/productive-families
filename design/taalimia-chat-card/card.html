<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بطاقة تعليمية شات</title>
<style>
@font-face{font-family:Alx;font-weight:400;src:url(fonts/alexandria-400-ar.woff);unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Alx;font-weight:400;src:url(fonts/alexandria-400-lat.woff);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Alx;font-weight:600;src:url(fonts/alexandria-600-ar.woff);unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Alx;font-weight:600;src:url(fonts/alexandria-600-lat.woff);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Alx;font-weight:800;src:url(fonts/alexandria-800-ar.woff);unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Alx;font-weight:800;src:url(fonts/alexandria-800-lat.woff);unicode-range:U+0000-00FF,U+2000-206F}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1638px;height:2048px;overflow:hidden;background:#000}
body{font-family:Alx,sans-serif}

/* ---------- themes (match the three reference backgrounds) ---------- */
.card{
  --ink:#fff; --sub:rgba(255,255,255,.78); --accent:#f39a2b;
  --bg:radial-gradient(1200px 1000px at 50% 42%,#4a2207 0%,#1d0c03 48%,#070302 78%,#050201 100%);
  --logo:url(assets/logo-white.png); --logo-blend:screen;
  --footer:url(assets/footer-dark.png);
  position:relative;width:1638px;height:2048px;overflow:hidden;background:var(--bg);
}
.card.amber{
  --bg:linear-gradient(180deg,#b44a08 0%,#c9600e 22%,#a8480a 52%,#3a1604 78%,#0c0502 88%,#050201 100%);
}
.card.light{
  --ink:#2a1405; --sub:#6a4120; --accent:#c4650f;
  --bg:linear-gradient(180deg,#fff 0%,#fff 100%);
  --logo:url(assets/logo-brown.png); --logo-blend:multiply;
  --footer:url(assets/footer-light.png);
}

/* diagonal satin streaks (as in the results poster) */
.streaks{position:absolute;inset:0;opacity:.18;
  background:repeating-linear-gradient(135deg,transparent 0 180px,rgba(255,190,110,.35) 180px 182px,transparent 182px 420px);
  -webkit-mask:linear-gradient(180deg,#000 0%,#000 55%,transparent 80%)}
.light .streaks{display:none}

.logo{position:absolute;top:82px;left:50%;transform:translateX(-50%);width:360px;height:120px;
  background:var(--logo) center/contain no-repeat}

/* ---------- floating amber glass cubes ---------- */
.cube{position:absolute;border-radius:26%;
  background:
    radial-gradient(60% 50% at 30% 25%,rgba(255,240,200,.75),transparent 60%),
    linear-gradient(145deg,#ffb347 0%,#f08a1c 40%,#b8540a 100%);
  box-shadow:inset 0 0 0 6px rgba(255,214,150,.45),inset -18px -22px 40px rgba(120,40,0,.55),0 30px 60px rgba(0,0,0,.35)}
.cube::after{content:"";position:absolute;inset:22%;border-radius:22%;
  background:linear-gradient(145deg,rgba(255,220,160,.55),rgba(255,160,60,.15));
  box-shadow:inset 0 0 0 3px rgba(255,230,190,.35)}
.c1{width:250px;height:250px;top:-40px;right:120px;transform:rotate(22deg);filter:blur(14px);opacity:.9}
.c2{width:230px;height:230px;top:150px;right:-70px;transform:rotate(-14deg);filter:blur(10px);opacity:.85}
.c3{width:120px;height:120px;top:640px;left:150px;transform:rotate(30deg);filter:blur(3px)}
.c4{width:80px;height:80px;top:1080px;right:190px;transform:rotate(-20deg);filter:blur(1.5px)}
.c5{width:60px;height:60px;top:470px;left:430px;transform:rotate(12deg);filter:blur(5px);opacity:.8}

/* ---------- hero: glass chat bubble ---------- */
.hero{position:absolute;top:300px;left:50%;transform:translateX(-50%);width:760px;height:640px}
.glow{position:absolute;inset:-120px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,150,40,.55),rgba(255,120,20,.18) 55%,transparent 75%)}
.light .glow{background:radial-gradient(closest-side,rgba(255,170,70,.35),transparent 72%)}

.bubble{position:absolute;left:70px;top:70px;width:620px;height:430px;border-radius:120px;
  background:
    radial-gradient(70% 55% at 28% 18%,rgba(255,244,215,.85),rgba(255,244,215,0) 55%),
    radial-gradient(80% 80% at 70% 95%,rgba(110,35,0,.55),transparent 60%),
    linear-gradient(150deg,#ffc469 0%,#f5931f 38%,#d0670c 70%,#8f3a05 100%);
  box-shadow:
    inset 0 0 0 10px rgba(255,214,150,.55),
    inset 0 0 0 12px rgba(150,60,0,.35),
    inset 0 -40px 80px rgba(120,40,0,.45),
    0 50px 90px rgba(0,0,0,.45);
  transform:perspective(1400px) rotateY(-14deg) rotateX(6deg)}
/* tail (separate element so it sits behind the bubble) */
.tail{position:absolute;left:70px;top:70px;width:620px;height:430px;transform:perspective(1400px) rotateY(-14deg) rotateX(6deg)}
.tail::before{content:"";position:absolute;width:130px;height:130px;bottom:-48px;right:110px;border-radius:0 0 34px 0;
  transform:rotate(45deg);background:linear-gradient(135deg,#c4600b,#8f3a05);
  box-shadow:inset -8px -8px 0 0 rgba(255,214,150,.5),0 30px 50px rgba(0,0,0,.35)}
/* inner glass inset */
.bubble::after{content:"";position:absolute;inset:48px;border-radius:80px;
  background:linear-gradient(160deg,rgba(255,236,200,.35),rgba(255,170,70,.08));
  box-shadow:inset 0 0 0 3px rgba(255,236,200,.4)}
.lines{position:absolute;z-index:2;top:150px;right:130px;left:130px;display:flex;flex-direction:column;gap:30px;align-items:flex-start}
.lines i{display:block;height:34px;border-radius:20px;background:linear-gradient(90deg,#fff3dc,#ffe0b0);
  box-shadow:0 4px 0 rgba(140,55,0,.35),inset 0 -4px 0 rgba(220,140,60,.4)}
.lines i:nth-child(1){width:100%}
.lines i:nth-child(2){width:72%}
.lines i:nth-child(3){width:46%}

/* notification badge */
.badge{position:absolute;z-index:3;top:20px;left:40px;width:170px;height:170px;border-radius:50%;
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:96px;line-height:1;padding-top:8px;
  background:radial-gradient(60% 50% at 35% 28%,#fff1d6 0%,rgba(255,241,214,0) 55%),linear-gradient(150deg,#7a2c05,#3b1302);
  box-shadow:inset 0 0 0 8px #f5a640,inset 0 0 0 11px rgba(255,230,180,.6),0 24px 50px rgba(0,0,0,.5)}
.light .badge{box-shadow:inset 0 0 0 8px #f5a640,inset 0 0 0 11px rgba(255,230,180,.6),0 24px 50px rgba(90,40,0,.35)}
.ring{position:absolute;z-index:2;top:-10px;left:10px;width:230px;height:230px;border-radius:50%;
  border:3px solid rgba(255,180,90,.55)}
.ring.r2{top:-40px;left:-20px;width:290px;height:290px;border-color:rgba(255,180,90,.25)}

/* ---------- copy ---------- */
.copy{position:absolute;top:1010px;left:0;right:0;text-align:center;color:var(--ink)}
.kicker{font-size:56px;font-weight:400;color:var(--sub);letter-spacing:0}
.title{margin-top:18px;font-size:150px;font-weight:800;line-height:1.1}
.title .acc{color:var(--accent)}
.desc{margin:34px auto 0;width:1100px;font-size:44px;font-weight:400;line-height:1.7;color:var(--sub)}

.cta{position:absolute;top:1520px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:30px;white-space:nowrap;
  padding:26px 38px 26px 64px;border-radius:30px;
  background:linear-gradient(180deg,#f7a33a,#d9700f);
  box-shadow:inset 0 0 0 4px rgba(255,226,175,.65),inset 0 -10px 0 rgba(140,55,0,.35),0 30px 60px rgba(0,0,0,.4);
  color:#2a1102;font-size:50px;font-weight:600}
.light .cta{box-shadow:inset 0 0 0 4px rgba(255,226,175,.65),inset 0 -10px 0 rgba(140,55,0,.35),0 26px 50px rgba(150,70,0,.3)}
.cta .arr{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;background:#3b1503}
.cta svg{width:56px;height:56px}

/* ---------- brand footer (taken from the institute's own posters) ---------- */
.footer{position:absolute;left:0;right:0;bottom:0;height:408px;background:var(--footer) bottom/100% auto no-repeat;
  -webkit-mask:linear-gradient(180deg,transparent 0,#000 120px)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="streaks"></div>
  <div class="cube c1"></div><div class="cube c2"></div><div class="cube c5"></div>
  <div class="logo"></div>

  <div class="hero">
    <div class="glow"></div>
    <div class="tail"></div>
    <div class="bubble"></div>
    <div class="lines" style="transform:perspective(1400px) rotateY(-14deg) rotateX(6deg)"><i></i><i></i><i></i></div>
    <div class="ring r2"></div><div class="ring"></div>
    <div class="badge">1</div>
  </div>
  <div class="cube c3"></div><div class="cube c4"></div>

  <div class="copy">
    <div class="kicker">لديك رسالة جديدة في</div>
    <div class="title">تعليميــة <span class="acc">شات</span></div>
    <div class="desc">يُرجى التوجّه إلى نظام المراسلات بالمعهد<br>للاطلاع على رسالتك والرد عليها</div>
  </div>

  <div class="cta">
    <span>تفقّد تعليمية شات الآن</span>
    <span class="arr"><svg viewBox="0 0 24 24" fill="none" stroke="#f7a33a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span>
  </div>

  <div class="footer"></div>
</div>
<script>
  const t = new URLSearchParams(location.search).get('theme');
  if (t) document.getElementById('card').classList.add(t);
</script>
</body>
</html>
